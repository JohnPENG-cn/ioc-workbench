.orange{grid-area:o;background:var(--orange)}
.black{grid-area:k;background:var(--black);color:#f5f5f7}
.glassc{grid-area:g;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.item{padding:12px 0;border-top:1px solid rgba(0,0,0,.12)}
.item:first-of-type{border-top:0;padding-top:0}
.item .t{font-weight:600;font-size:15px;line-height:1.45}
.item .d{font-size:13.5px;margin-top:4px;color:rgba(0,0,0,.72)}
.item .m{font-size:12px;margin-top:6px;color:rgba(0,0,0,.55)}
.kicker{font-size:12px;letter-spacing:.5px;color:rgba(0,0,0,.55);margin-bottom:2px}
.orange .grid2{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin-top:6px}
.orange .grid2 span:nth-child(odd){color:rgba(0,0,0,.55);white-space:nowrap}
.black .item{border-top-color:rgba(255,255,255,.12)}
.black .item .d{color:rgba(255,255,255,.7)}
.black .item .m{color:rgba(255,255,255,.5)}
.black .badge-wait{background:var(--yellow);color:#111}
.black .big{font-size:40px;font-weight:300;line-height:1;margin:2px 0 14px}
.black .big small{font-size:14px;color:rgba(255,255,255,.6);margin-left:8px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;line-height:1.5}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.s-正常{background:#dff5e8;color:#16824b}
.s-待确认{background:#ececee;color:#5f6066}
.s-异常{background:#fde2e2;color:#c8282e}
.s-暂停{background:#e3effd;color:#1767c2}
.c-ok{background:rgba(47,179,107,.14);color:#16824b}
.c-half{background:rgba(251,141,69,.18);color:#b4561a}
.c-self{background:rgba(0,0,0,.07);color:#55565b}
.tag.plain::before{display:none}
.badge-wait{background:#111;color:var(--yellow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.stat{background:rgba(255,255,255,.55);border-radius:18px;padding:12px 14px}
.stat .v{font-size:30px;font-weight:300;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--ink2)}
.gloss{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;margin-top:14px;font-size:13px;color:var(--ink2)}
.gloss b{color:var(--ink);font-weight:600;margin-right:4px}
section.panel{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r);padding:22px;margin-bottom:18px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.panel h2{font-size:20px;font-weight:500;margin:0}
.panel .cap{font-size:13px;color:var(--ink3);margin:4px 0 14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.6);border:1px solid var(--glass-b);border-radius:999px;padding:8px 14px}
.search input{border:0;background:transparent;outline:0;font:inherit;font-size:14px;width:100%;min-width:0;color:var(--ink)}
.pill{border:1px solid var(--glass-b);background:rgba(255,255,255,.55);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.pill.on{background:var(--yellow);color:#111;border-color:transparent;font-weight:600}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:12.5px;font-weight:500;color:var(--ink3);text-align:left;padding:8px 10px;border-bottom:1px solid rgba(0,0,0,.08)}
td{font-size:13.5px;padding:14px 10px;vertical-align:top;border-bottom:1px solid rgba(0,0,0,.06);word-break:break-word;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
.botname{font-weight:600}
.avatar{width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;font-size:14px;font-weight:600;margin-right:10px;flex:none;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bcell{display:flex;align-items:center}
.tags{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.muted{color:var(--ink2)}
.small{font-size:12.5px;color:var(--ink3)}
.lib a{text-decoration:none;font-weight:500}
.lib a:hover{text-decoration:underline}
.arrow{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.75);text-decoration:none;font-size:14px}
details.appx{background:var(--glass);border:1px solid var(--glass-b);border-radius:20px;margin-bottom:10px;padding:0 20px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
details.appx>summary{cursor:pointer;list-style:none;padding:16px 0;font-weight:500;font-size:16px;display:flex;justify-content:space-between;align-items:center}
details.appx>summary::-webkit-details-marker{display:none}
details.appx>summary::after{content:"＋";color:var(--ink3)}
details.appx[open]>summary::after{content:"－"}
details.appx .body{padding-bottom:18px;font-size:14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px;margin:8px 0 12px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
ol{padding-left:20px;margin:8px 0 14px;font-size:13.5px}
footer{font-size:12px;color:var(--ink3);text-align:center;margin-top:24px}
.empty{padding:16px;color:var(--ink3);font-size:13px}

/* ---------- 平板 ---------- */
@media (max-width:980px){
  .bento{grid-template-columns:1fr 1fr;grid-template-areas:"y o" "k k" "g g"}
  h1{font-size:42px}
}
/* ---------- 手机：卡片竖排，表格变卡片 ---------- */
@media (max-width:640px){
  .wrap{padding:14px 12px 40px}
  .shell{padding:16px;border-radius:26px}
  h1{font-size:34px}
  .logo{width:30px;height:30px;margin-right:10px}
  .bento{grid-template-columns:1fr;grid-template-areas:"y" "k" "o" "g";gap:12px}
  .card,section.panel{padding:18px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .gloss{grid-template-columns:1fr}
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{background:rgba(255,255,255,.5);border-radius:18px;padding:12px 14px;margin-bottom:10px}
  table.stack td{border:0;padding:5px 0}
  table.stack td[data-l]::before{content:attr(data-l);display:block;font-size:11.5px;color:var(--ink3);margin-bottom:1px}
  .tags{flex-direction:row;flex-wrap:wrap}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  details.appx{padding:0 14px}
  table.lib td[data-l]::before{display:none}
  table.lib td[data-l]{display:inline;font-size:12.5px;padding:0;margin-right:10px}
  table.lib td:first-child{padding-bottom:4px}
  table.lib td:last-child{display:none}
  table.lib tr{padding:12px 14px}
}
</style>
</head>
<body>
<div class="wrap"><div class="shell" id="app"></div>
<footer>本地文件，未发布。不构成投资建议。改内容只需改页面顶部的 DATA 数据块。</footer></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const statusTag = s => `<span class="tag s-${esc(s)}">${esc(s)}</span>`;
const checkTag = c => {
  const cls = c.startsWith("已核对") ? "c-ok" : c.startsWith("部分") ? "c-half" : "c-self";
  return `<span class="tag ${cls}">${esc(c)}</span>`;
};
const link = (txt, href) => href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(txt)} ↗</a>` : esc(txt);
const D = DATA;
const count = s => D.bots.filter(b => b.status === s).length;
const short = n => n.replace("公司财报研究-采购视角","财").replace("产业链情报-反常识","反").replace("晨间新闻","晨").replace("知识与经验","知").replace("日记本","记");
const logo = `<svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 4h28l-14 16z M6 36h28L20 20z" fill="#1d1d1f"/></svg>`;

let libBot = "全部", libQ = "";

function render(){
  const app = document.getElementById("app");
  app.innerHTML = `
  <header>
    <div>
      <h1>${logo}${esc(D.title)}</h1>
      <p class="sub">${esc(D.summary)}</p>
    </div>
    <div class="chips"><span class="chip">${esc(D.version)}</span><span class="chip">更新：${esc(D.updated)}</span></div>
  </header>

  <div class="banner">
    <div class="dot">i</div>
    <div><b>初始化结论：</b>${esc(D.init.lead)}
      <details><summary>展开说明</summary>${esc(D.init.text)}</details>
    </div>
  </div>

  <div class="bento">
    <div class="card yellow">
      <h2>今日重要信息 <span class="n">${D.important.length} 条</span></h2>
      ${D.important.map(x => `
        <div class="item">
          <div class="kicker">${esc(x.tag)} ${x.status ? `<span class="tag badge-wait plain">${esc(x.status)}</span>` : ""}</div>
          <div class="t">${esc(x.title)}</div>
          <div class="d">${esc(x.detail)}</div>
          <div class="m">${link(x.meta, x.href)}</div>
        </div>`).join("")}
    </div>

    <div class="card orange">
      <h2>自主发现 <span class="n">已确认 0 · 待确认 ${D.autonomy.length}</span></h2>
      <div class="d" style="font-size:13px;color:rgba(0,0,0,.7);margin-bottom:10px">${esc(D.autonomyIntro)}</div>
      ${D.autonomy.map(x => `
        <div class="item">
          <div class="kicker">${esc(x.type)} <span class="tag s-待确认">待确认</span></div>
          <div class="t" style="font-size:14px">${esc(x.clue)}</div>
          <div class="grid2">
            <span>新颖性</span><span>${esc(x.novelty)}</span>
            <span>证据质量</span><span>${esc(x.evidence)}</span>
            <span>潜在价值</span><span>${esc(x.value)}</span>
            <span>继续跟踪</span><span>${esc(x.follow)}</span>
          </div>
        </div>`).join("")}
      <div class="m" style="font-size:12px;color:rgba(0,0,0,.6);margin-top:8px">${esc(D.autonomyNote)}</div>
    </div>

    <div class="card black">
      <h2>待我处理 <span class="n" style="background:rgba(255,255,255,.12)">只留要你动手的</span></h2>
      <div class="big">${D.todo.length}<small>件事等你</small></div>
      ${D.todo.map(x => `
        <div class="item">
          <div class="t">${esc(x.title)} <span class="tag badge-wait plain">等你</span></div>
          <div class="d">${esc(x.detail)}</div>
          ${x.meta ? `<div class="m">${link(x.meta, x.href)}</div>` : ""}
        </div>`).join("")}
    </div>

    <div class="card glassc">
      <h2>运行概览 <span class="n">按我看得到的产出算</span></h2>
      <div class="stats">
        <div class="stat"><div class="v">${count("正常")}</div><div class="l">${statusTag("正常")}</div></div>
        <div class="stat"><div class="v">${count("待确认")}</div><div class="l">${statusTag("待确认")}</div></div>
        <div class="stat"><div class="v">${count("异常")}</div><div class="l">${statusTag("异常")}</div></div>
        <div class="stat"><div class="v">${D.bots.length}</div><div class="l">定时任务后台：无法验证</div></div>
      </div>
      <div class="gloss">${D.glossary.map(g => `<div><b>${esc(g[0])}</b>${esc(g[1])}</div>`).join("")}</div>
    </div>
  </div>

  <section class="panel">
    <h2>Bot 运行状态</h2>
    <p class="cap">时间均为北京时间。状态以我看得到的产出为准，Bot 的自述单独标明（灰色“仅自述”标签）。</p>
    <table class="stack">
      <colgroup><col style="width:22%"><col style="width:14%"><col style="width:18%"><col style="width:20%"><col style="width:26%"></colgroup>
      <thead><tr><th>Bot</th><th>状态 / 核对程度</th><th>最近一次交付</th><th>证据</th><th>要注意的地方</th></tr></thead>
      <tbody>${D.bots.map(b => `
        <tr>
          <td><div class="bcell"><span class="avatar">${esc(short(b.name))}</span><span class="botname">${esc(b.name)}</span></div></td>
          <td data-l="状态 / 核对程度"><div class="tags">${statusTag(b.status)}${checkTag(b.check)}</div></td>
          <td data-l="最近一次交付">${esc(b.last)}</td>
          <td data-l="证据" class="muted">${esc(b.evidence)}</td>
          <td data-l="要注意的地方" class="muted">${esc(b.note)}</td>
        </tr>`).join("")}</tbody>
    </table>
  </section>

  <section class="panel">
    <h2>研究成果库</h2>
    <p class="cap">${esc(D.libraryNote)}</p>
    <div class="toolbar">
      <label class="search"><span aria-hidden="true">⌕</span><input id="q" placeholder="搜标题或主题" value="${esc(libQ)}"></label>
      ${D.libraryFilters.map(f => `<button class="pill${f===libBot?" on":""}" data-f="${esc(f)}">${esc(f)}</button>`).join("")}
    </div>
    <div id="lib"></div>
  </section>

  <details class="appx"><summary>附录：Bot 档案（自述，属于承诺）</summary><div class="body">
    <p class="muted">${esc(D.profilesIntro)}</p>
    <table class="stack">
      <thead><tr>${D.profileCols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${D.profiles.map(r => `<tr>${r.map((c,i) => i===0 ? `<td class="botname">${esc(c)}</td>` : `<td data-l="${esc(D.profileCols[i])}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table>
  </div></details>

  <details class="appx"><summary>附录：监控规则与验证来源</summary><div class="body">
    <dl class="kv">${D.rules.map(r => `<dt>${r[0]==="无法验证" ? `<span class="tag c-self">无法验证</span>` : statusTag(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
    <ol>${D.ruleNotes.map(n => `<li>${esc(n)}</li>`).join("")}</ol>
    <table class="stack">
      <thead><tr><th>Bot</th><th>我能看到</th><th>我看不到</th></tr></thead>
      <tbody>${D.visibility.map(r => `<tr><td class="botname">${esc(r[0])}</td><td data-l="我能看到">${esc(r[1])}</td><td data-l="我看不到" class="muted">${esc(r[2])}</td></tr>`).join("")}</tbody>
    </table>
  </div></details>

  <details class="appx"><summary>附录：信息卡片模板</summary><div class="body">
    <dl class="kv">${D.cardTemplate.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
    <p class="muted">${esc(D.cardTemplateNote)}</p>
  </div></details>

  <details class="appx"><summary>附录：现在的机制能做到什么</summary><div class="body">
    <table class="stack">
      <thead><tr><th style="width:18%">能力</th><th style="width:22%">现在能不能</th><th>原因和缺口</th></tr></thead>
      <tbody>${D.capability.map(r => `<tr><td class="botname">${esc(r[0])}</td><td data-l="现在能不能">${esc(r[1])}</td><td data-l="原因和缺口" class="muted">${esc(r[2])}</td></tr>`).join("")}</tbody>
    </table>
  </div></details>
  `;
  app.querySelectorAll(".pill").forEach(p => p.onclick = () => { libBot = p.dataset.f; app.querySelectorAll(".pill").forEach(x => x.classList.toggle("on", x === p)); renderLib(); });
  app.querySelector("#q").oninput = e => { libQ = e.target.value.trim(); renderLib(); };
  renderLib();
}

function renderLib(){
  const rows = D.library
    .filter(l => libBot === "全部" || l.bot === libBot)
    .filter(l => !libQ || (l.title + l.site).toLowerCase().includes(libQ.toLowerCase()))
    .sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById("lib").innerHTML = rows.length ? `
    <table class="stack lib">
      <colgroup><col style="width:52%"><col style="width:22%"><col style="width:16%"><col style="width:10%"></colgroup>
      <thead><tr><th>标题</th><th>来源 · 主题</th><th>日期</th><th></th></tr></thead>
      <tbody>${rows.map(l => `<tr>
        <td><a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.title)}</a></td>
        <td data-l="来源 · 主题" class="muted">${esc(l.site)}</td>
        <td data-l="日期" class="muted">${esc(l.date)}</td>
        <td><a class="arrow" href="${esc(l.href)}" target="_blank" rel="noopener" aria-label="打开原文">↗</a></td>
      </tr>`).join("")}</tbody>
    </table>` : `<div class="empty">没有符合条件的条目。</div>`;
}
render();
</script>
</body>
</html>
